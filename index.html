<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North America Approval Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 120px;
            left: 0;
            right: 0;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: white;
            border-top: 2px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
        }
        #date-label {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        #slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        #date-slider {
            flex: 1;
            height: 8px;
            cursor: pointer;
        }
        .control-btn {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #45a049;
        }
        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #play-btn {
            background: #2196F3;
        }
        #play-btn:hover {
            background: #0b7dda;
        }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .legend-scale {
            display: flex;
            height: 20px;
            margin: 5px 0;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <div id="date-label">Loading...</div>
        <div id="slider-container">
            <button class="control-btn" id="prev-btn">◀ Previous</button>
            <button class="control-btn" id="play-btn">▶ Play</button>
            <input type="range" id="date-slider" min="0" max="100" value="0">
            <button class="control-btn" id="next-btn">Next ▶</button>
        </div>
    </div>

    <script>
        // Initialize map centered on North America
        const map = L.map('map', {
            center: [50, -100],
            zoom: 3,
            minZoom: 3,
            maxZoom: 6,
            maxBounds: [[15, -170], [75, -50]]
        });

        // Add base map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            subdomains: 'abcd'
        }).addTo(map);

        // Global variables
        let approvalData = [];
        let dates = [];
        let currentIndex = 0;
        let geojsonLayer = null;
        let isPlaying = false;
        let playInterval = null;
        let geoData = null;
        let globalMin = null;
        let globalMax = null;

        // Color scale function (RdYlGn - Red to Yellow to Green, 8 steps)
        function getColor(value, min, max) {
            if (value === null || value === undefined) return '#cccccc';
            const normalized = (value - min) / (max - min);
            // RdYlGn color scale with 8 gradations
            if (normalized > 0.875) return '#006837';  // Darkest green
            if (normalized > 0.75) return '#1a9850';   // Dark green
            if (normalized > 0.625) return '#66bd63';  // Medium green
            if (normalized > 0.5) return '#a6d96a';    // Light green
            if (normalized > 0.375) return '#ffffbf';  // Yellow
            if (normalized > 0.25) return '#fdae61';   // Light orange
            if (normalized > 0.125) return '#f46d43';  // Medium orange
            return '#d73027';                          // Dark red
        }

        // Style function for polygons
        function style(feature, approvalValues, min, max) {
            const value = approvalValues[feature.properties.name];
            return {
                fillColor: getColor(value, min, max),
                weight: 2,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        // Load and process data
        async function loadData() {
            try {
                // Load approval data
                const response = await fetch('approval_data.json');
                approvalData = await response.json();
                
                // Get unique dates and sort
                const uniqueDates = [...new Set(approvalData.map(d => d.date))];
                dates = uniqueDates.sort();
                
                // Set fixed scale from 0 to 100
                globalMin = 0;
                globalMax = 100;
                
                // Update slider
                const slider = document.getElementById('date-slider');
                slider.max = dates.length - 1;
                
                // Load GeoJSON
                const geoResponse = await fetch('north_america_clean.geojson');
                geoData = await geoResponse.json();
                
                // Display first date
                updateMap(0);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('date-label').textContent = 'Error loading data';
            }
        }

        // Update map for specific date index
        function updateMap(index) {
            currentIndex = index;
            const currentDate = dates[index];
            
            // Filter data for current date
            const dateData = approvalData.filter(d => d.date === currentDate);
            
            // Create lookup object
            const approvalValues = {};
            dateData.forEach(d => {
                approvalValues[d.country] = d.average;
            });
            
            // Remove existing layer
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }
            
            // Add new layer (use global min/max)
            geojsonLayer = L.geoJSON(geoData, {
                style: (feature) => style(feature, approvalValues, globalMin, globalMax),
                onEachFeature: (feature, layer) => {
                    const value = approvalValues[feature.properties.name];
                    layer.bindPopup(`
                        <strong>${feature.properties.name}</strong><br>
                        Approval: ${value ? value.toFixed(1) + '%' : 'N/A'}
                    `);
                    
                    // Add hover label
                    layer.bindTooltip(`${feature.properties.name}: ${value ? value.toFixed(1) + '%' : 'N/A'}`, {
                        permanent: false,
                        direction: 'center',
                        className: 'country-label'
                    });
                }
            }).addTo(map);
            
            // Update date label
            const dateObj = new Date(currentDate);
            const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
            document.getElementById('date-label').textContent = dateStr;
            
            // Update slider
            document.getElementById('date-slider').value = index;
            
            // Update button states
            updateButtons();
            
            // Add legend if not exists (use global min/max)
            if (!document.querySelector('.legend')) {
                addLegend(globalMin, globalMax);
            }
        }

        // Add legend
        function addLegend(min, max) {
            const legend = L.control({position: 'bottomright'});
            
            legend.onAdd = function(map) {
                const div = L.DomUtil.create('div', 'legend');
                div.innerHTML = `
                    <div class="legend-title">Approval Rating</div>
                    <div class="legend-scale">
                        <div style="flex: 1; background: #d73027;"></div>
                        <div style="flex: 1; background: #f46d43;"></div>
                        <div style="flex: 1; background: #fdae61;"></div>
                        <div style="flex: 1; background: #ffffbf;"></div>
                        <div style="flex: 1; background: #a6d96a;"></div>
                        <div style="flex: 1; background: #66bd63;"></div>
                        <div style="flex: 1; background: #1a9850;"></div>
                        <div style="flex: 1; background: #006837;"></div>
                    </div>
                    <div class="legend-labels">
                        <span>${min.toFixed(0)}%</span>
                        <span>${max.toFixed(0)}%</span>
                    </div>
                `;
                return div;
            };
            
            legend.addTo(map);
        }

        // Update button states
        function updateButtons() {
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === dates.length - 1;
        }

        // Play/pause animation
        function togglePlay() {
            const playBtn = document.getElementById('play-btn');
            
            if (isPlaying) {
                clearInterval(playInterval);
                isPlaying = false;
                playBtn.textContent = '▶ Play';
            } else {
                isPlaying = true;
                playBtn.textContent = '⏸ Pause';
                
                playInterval = setInterval(() => {
                    if (currentIndex < dates.length - 1) {
                        updateMap(currentIndex + 1);
                    } else {
                        togglePlay();
                    }
                }, 500);
            }
        }

        // Event listeners
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentIndex > 0) updateMap(currentIndex - 1);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentIndex < dates.length - 1) updateMap(currentIndex + 1);
        });

        document.getElementById('play-btn').addEventListener('click', togglePlay);

        document.getElementById('date-slider').addEventListener('input', (e) => {
            updateMap(parseInt(e.target.value));
        });

        // Load data on page load
        loadData();
    </script>
</body>
</html>
